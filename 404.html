<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Not found</title>
<meta name="robots" content="noindex">
<script>
  // Old project paths that moved: /desktop-lyrics/<rest> → /lyricopter/<rest> (path, query, hash kept).
  var MOVED = { 'desktop-lyrics': 'lyricopter', 'dl-rename-probe': 'dl-rename-probe-2' };
  var m = location.pathname.match(/^\/([^\/]+)(\/.*)?$/);
  if (m && MOVED.hasOwnProperty(m[1])) {
    location.replace('https://velibkolay.github.io/' + MOVED[m[1]] + (m[2] || '/') + location.search + location.hash);
  }
</script>
</head>
<body>
<p>Page not found. Looking for <a href="https://velibkolay.github.io/lyricopter/">Lyricopter</a>?</p>
</body>
</html>
